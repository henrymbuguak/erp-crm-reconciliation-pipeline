services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
      POSTGRES_DB: reconcile
    ports:
      # Mapped to 5433, not 5432, to avoid clashing with a locally installed
      # Postgres that may already be listening on the default port.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
