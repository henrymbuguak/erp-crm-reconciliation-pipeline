name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (see README "Local
          # development network note"), so key the cache off pyproject.toml
          # instead of the default `**/uv.lock` glob, which never matches.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

      - name: Smoke test CLI
        run: uv run datagen generate --seed 1 --customers 10 --with-ground-truth --output-dir /tmp/datagen-smoke
