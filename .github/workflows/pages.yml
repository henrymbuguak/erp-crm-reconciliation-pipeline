name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".vale.ini"
      - ".vale/styles/Project/**"
      - ".vale/styles/config/**"
      - "docs/**"
      - "eval/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".vale.ini"
      - ".vale/styles/Project/**"
      - ".vale/styles/config/**"
      - "docs/**"
      - "eval/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Vale
        run: |
          curl -sSfL -o vale.tar.gz \
            https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf vale.tar.gz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync Vale styles
        run: vale sync

      - name: Lint docs against the Google developer documentation style guide
        # docs/reference/api.md is mkdocstrings-generated from source
        # docstrings (already reviewed as prose in src/datagen/), and its
        # rendered function signatures contain lowercase code identifiers
        # (like the "rng" parameter name) that trip up casing-consistency
        # checks derived from our Vocab. Exclude it from prose linting.
        run: vale --glob='!**/api.md' README.md docs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (see README "Local
          # development network note"), so key the cache off pyproject.toml
          # instead of the default `**/uv.lock` glob, which never matches.
          cache-dependency-glob: "pyproject.toml"

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build documentation
        run: uv run mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, lint-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
