StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google

# Project-specific exceptions and overrides, committed to the repo
# alongside the synced Google/Vale packages (see .gitignore).
Vocab = Project

[*.md]
BasedOnStyles = Vale, Google, Project
# We deliberately keep "CLI" instead of Google's suggested "command-line
# tool": it's standard, unambiguous vocabulary for our developer audience,
# and Google's own style guide sanctions project-specific exceptions like
# this. Project/WordList.yml carries the rest of Google's word list minus
# that one entry.
Google.WordList = NO
# "camelCase" is used literally/correctly as a naming-convention term, not
# as figurative jargon. Project/Jargon.yml carries the rest of Google's
# jargon list minus that one entry.
Google.Jargon = NO
