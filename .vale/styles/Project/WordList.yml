extends: substitution
message: "Use '%s' instead of '%s'."
link: "https://developers.google.com/style/word-list"
level: warning
# This is Google's WordList.yml with one deliberate removal: we keep "CLI"
# instead of forcing "command-line tool" everywhere. "CLI" is standard,
# unambiguous vocabulary for our developer audience, our own reference page
# is literally titled "CLI reference", and Google.Headings itself already
# exempts "CLI" in headings -- this override just extends that same
# reasoning to body text. Google's guide explicitly sanctions
# project-specific exceptions like this (see "Break the rules").
ignorecase: false
action:
  name: replace
swap:
  Ajax: AJAX
  Android device: Android-powered device
  android: Android
  API explorer: APIs Explorer
  authN: authentication
  authZ: authorization
  Cloud: Google Cloud Platform|GCP
  Container Engine: Kubernetes Engine
  Developers Console: Google API Console|API Console
  Google account: Google Account
  Google accounts: Google Accounts
  Googling: search with Google
  HTTPs: HTTPS
  k8s: Kubernetes
  SHA1: SHA-1|HAS-SHA1
  url: URL
  World Wide Web: web
