repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # mkdocs.yml legitimately uses a `!!python/name:...` tag (standard
        # mkdocs-material/pymdown-extensions config); --unsafe still checks
        # syntax but permits custom tags instead of rejecting them outright.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files

  # Run through `uv run` so mypy always uses the exact version/plugins/stubs
  # currently installed in this project's environment.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
